<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Lens canvas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #101216;
    color: #e6e8eb;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid #23272e;
    position: sticky;
    top: 0;
    background: #101216f2;
    backdrop-filter: blur(4px);
    z-index: 1;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  #tabs button {
    background: #1a1e25;
    color: #aab2bc;
    border: 1px solid #23272e;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #tabs button[aria-selected="true"] {
    background: #2b3242;
    color: #fff;
    border-color: #3d4a63;
  }
  #stage { padding: 16px; overflow-x: auto; }
  #stage svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  #status {
    max-width: 480px;
    margin: 20vh auto;
    text-align: center;
    color: #8a929d;
    font-size: 14px;
  }
  #status code { color: #c4ccd6; }
</style>
</head>
<body>
<header>
  <h1>PR Lens</h1>
  <nav id="tabs"></nav>
</header>
<main id="app"><div id="status">Loading canvas…</div></main>
<script src="/polyfills.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
